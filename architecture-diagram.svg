<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Forecast — System Architecture</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">Fantasy stock market for competitive Fortnite, economics validated before implementation</text>

  <!-- Simulator -->
  <rect x="40" y="90" width="230" height="150" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="155" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">forecast_sim</text>
  <text x="155" y="134" text-anchor="middle" font-size="11" fill="#6d28d9">Python economy simulator</text>
  <text x="60" y="156" font-size="11" fill="#4c1d95">• 100+ batch simulated runs</text>
  <text x="60" y="174" font-size="11" fill="#4c1d95">• 15 trading-strategy archetypes</text>
  <text x="60" y="192" font-size="11" fill="#4c1d95">• Gini, turnover, liquidity metrics</text>
  <text x="60" y="210" font-size="11" fill="#4c1d95">• Success-criteria evaluator</text>
  <text x="155" y="226" text-anchor="middle" font-size="10" font-style="italic" fill="#7c3aed">offline validation, not a running service</text>

  <!-- arrow simulator -> backend -->
  <path d="M 270 165 L 350 165" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="310" y="150" text-anchor="middle" font-size="10" fill="#7c3aed">locked economics</text>

  <!-- Backend container -->
  <rect x="350" y="90" width="330" height="330" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="515" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">forecast-backend</text>
  <text x="515" y="134" text-anchor="middle" font-size="11" fill="#2563eb">FastAPI + SQLAlchemy</text>

  <rect x="370" y="148" width="290" height="60" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="515" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">api/ — auth, orders, wallet, dividends,</text>
  <text x="515" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">treasury, auctions, markets, admin, ws</text>
  <text x="515" y="198" text-anchor="middle" font-size="9" fill="#3b82f6">HTTP + WebSocket routes (thin controllers)</text>

  <rect x="370" y="218" width="290" height="60" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="515" y="238" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">services/ — business logic</text>
  <text x="515" y="256" text-anchor="middle" font-size="9" fill="#3b82f6">wallet · positions · order matching · dividends</text>
  <text x="515" y="270" text-anchor="middle" font-size="9" fill="#3b82f6">treasury · auctions · bot trading population</text>

  <rect x="370" y="288" width="290" height="52" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="515" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">engine/ — pure logic, zero dependencies</text>
  <text x="515" y="326" text-anchor="middle" font-size="9" fill="#3b82f6">matching engine · apportionment math · pricing</text>

  <rect x="370" y="350" width="290" height="50" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="515" y="370" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">jobs/ — RQ background workers</text>
  <text x="515" y="388" text-anchor="middle" font-size="9" fill="#3b82f6">dividend payouts · treasury accrual</text>

  <!-- Frontend -->
  <rect x="730" y="90" width="230" height="150" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="845" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Frontend</text>
  <text x="845" y="134" text-anchor="middle" font-size="11" fill="#059669">React + TypeScript + Vite</text>
  <text x="750" y="156" font-size="11" fill="#065f46">• Auth, dashboard, markets</text>
  <text x="750" y="174" font-size="11" fill="#065f46">• Trade modal (limit + quick)</text>
  <text x="750" y="192" font-size="11" fill="#065f46">• Portfolio, leaderboard</text>
  <text x="750" y="210" font-size="11" fill="#065f46">• Live prices via WebSocket</text>
  <text x="845" y="226" text-anchor="middle" font-size="10" font-style="italic" fill="#059669">Tailwind v4 + shadcn/ui</text>

  <!-- arrow backend <-> frontend -->
  <path d="M 680 165 L 730 165" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 730 185 L 680 185" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="705" y="150" text-anchor="middle" font-size="9" fill="#475569">REST</text>
  <text x="705" y="205" text-anchor="middle" font-size="9" fill="#475569">WS</text>

  <!-- Postgres -->
  <rect x="370" y="450" width="130" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="435" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">PostgreSQL</text>
  <text x="435" y="496" text-anchor="middle" font-size="10" fill="#4338ca">Supabase (managed)</text>
  <text x="435" y="514" text-anchor="middle" font-size="9" fill="#4338ca">wallets, orders,</text>
  <text x="435" y="527" text-anchor="middle" font-size="9" fill="#4338ca">trades, positions</text>

  <!-- Redis -->
  <rect x="530" y="450" width="130" height="90" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="595" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Redis</text>
  <text x="595" y="496" text-anchor="middle" font-size="10" fill="#dc2626">Upstash (managed)</text>
  <text x="595" y="514" text-anchor="middle" font-size="9" fill="#dc2626">pub/sub price feed</text>
  <text x="595" y="527" text-anchor="middle" font-size="9" fill="#dc2626">+ RQ job queue</text>

  <path d="M 435 450 L 435 400" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 595 450 L 595 400" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Bot population note -->
  <rect x="370" y="560" width="290" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="515" y="577" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Bot trading population (10 strategies)</text>
  <text x="515" y="592" text-anchor="middle" font-size="9" fill="#b45309">runs on a background loop, same code path as real users</text>
</svg>
